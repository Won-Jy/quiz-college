name: Quiz du jour

on:
  schedule:
    # Jamais a l'heure pile : c'est la minute la plus chargee chez GitHub,
    # et les crons y sont purement et simplement abandonnes.
    # Quatre tentatives decalees ; la garde ci-dessous laisse passer la
    # premiere utile et bloque les suivantes, puisqu'elle verifie si le
    # quiz du jour existe deja.
    - cron: "7 14 * * 1-6"    # 16h07 a Paris
    - cron: "41 14 * * 1-6"   # 16h41
    - cron: "23 15 * * 1-6"   # 17h23
    - cron: "12 16 * * 1-6"   # 18h12
  workflow_dispatch:
    inputs:
      matiere:
        description: "Forcer une matiere (pour tester). auto = suivre le planning du jour."
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - francais
          - anglais
          - maths
          - histoire

permissions:
  contents: write

concurrency:
  group: quiz-du-jour
  cancel-in-progress: false

jobs:
  quiz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Faut-il generer le quiz maintenant ?
        id: garde
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Lancement manuel : on continue."
            echo "go=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          HEURE=$(TZ=Europe/Paris date +%H)
          JOUR=$(TZ=Europe/Paris date +%F)
          echo "Paris : $JOUR ${HEURE}h"

          if [ -f "data/$JOUR.json" ]; then
            echo "Le quiz du $JOUR existe deja."
            echo "go=false" >> $GITHUB_OUTPUT
          elif [ "$HEURE" -ge 16 ]; then
            echo "Pas encore de quiz aujourd'hui : on genere."
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "Trop tot (avant 16h)."
            echo "go=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.garde.outputs.go == 'true'
        with:
          python-version: "3.11"

      - name: Installer les dependances
        if: steps.garde.outputs.go == 'true'
        run: pip install --quiet anthropic

      - name: Generer et envoyer le quiz
        if: steps.garde.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          QUIZ_MATIERE: ${{ github.event.inputs.matiere }}
        run: python generate_quiz.py

      - name: Enregistrer le quiz dans le depot
        if: steps.garde.outputs.go == 'true'
        run: |
          git config user.name "quiz-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "Rien a committer."
            exit 0
          fi
          git commit -m "Quiz du $(TZ=Europe/Paris date +%F)"
          git pull --rebase origin ${{ github.ref_name }}
          git push
